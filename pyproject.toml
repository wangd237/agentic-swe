[project]
name = "agentic-swe"
version = "0.1.0"
description = "OpenAI-compatible coding agent that fixes real GitHub issues"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 200
target-version = "py310"
exclude = ["scripts", "benchmarks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
]

[tool.ruff.lint.per-file-ignores]
# tests 里 sys.path 注入必须先于业务 import，E402 是预期结构
"tests/*" = ["E402"]
# patcher.py 是历史 rule-based 策略库，Day 3 将瘦身，不逐行修长行
"app/agent/patcher.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "evals", "scripts"]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp"
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".pytest_cache",
    ".pytest_tmp*",
    "benchmarks",
    "logs",
    "evals",
    "third_project",
]
